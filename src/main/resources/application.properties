spring.application.name=servicenow-integration

# Adapter API base URL and timeouts
adapter.base-url=http://localhost:8081
adapter.connect-timeout-ms=2000
adapter.read-timeout-ms=5000

# Disable DB auto-configuration (this service does not use a DB yet)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Server config (optional)
server.port=8080

# Jackson: accept empty string ("") as null for object fields (e.g., LinkValueDTO)
spring.jackson.deserialization.ACCEPT_EMPTY_STRING_AS_NULL_OBJECT=true

# SAP adapter configuration (bound to SAPApiProperties)
sap.api.base-url=http://localhost:8088
sap.api.auth-token=
sap.api.onboarding-candidate-endpoint=/api/service_now/onboarding_candidate_info

# ServiceNow configuration
servicenow.api.instance-base-url=https://dev313338.service-now.com

#Set logging level for debugging purposes
logging.level.com.cag=DEBUG

# Timeout Configuration for preventing data overload
# API Timeout Settings
app.timeout.api.request-timeout-seconds=30
app.timeout.api.connection-timeout-ms=5000
app.timeout.api.read-timeout-ms=10000
app.timeout.api.write-timeout-ms=10000
app.timeout.api.paginated-request-timeout-seconds=45
app.timeout.api.warning-threshold-seconds=20

# Database Timeout Settings (when database is added)
app.timeout.database.query-timeout-seconds=10
app.timeout.database.paginated-query-timeout-seconds=15
app.timeout.database.connection-pool-timeout-ms=30000
app.timeout.database.idle-timeout-ms=600000
app.timeout.database.max-lifetime-ms=1800000

# Circuit Breaker Settings for resilience
app.timeout.circuit-breaker.enabled=true
app.timeout.circuit-breaker.failure-threshold=3
app.timeout.circuit-breaker.wait-duration-seconds=30
app.timeout.circuit-breaker.sliding-window-size=10
app.timeout.circuit-breaker.minimum-number-of-calls=5

# Server request timeout (global)
server.servlet.session.timeout=30m

# Tomcat specific timeouts
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=100